<!DOCTYPE html><html><head><title>Login - TrustVault</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#0a0f1e;color:white;display:flex;justify-content:center;padding:30px 20px}.box{background:#1e293b;padding:30px;border-radius:15px;width:100%;max-width:420px;margin-top:30px}h2{color:#38bdf8;text-align:center}.sub{text-align:center;color:#94a3b8;font-size:13px;margin:8px 0 20px}label{font-size:13px;color:#cbd5e1;display:block;margin-bottom:6px;margin-top:12px}input{width:100%;padding:12px;border:none;border-radius:8px;background:#0f172a;color:white;outline:none}.roles{display:flex;gap:8px;margin-top:8px}.role{flex:1;text-align:center;padding:12px 5px;border-radius:10px;background:#0f172a;border:2px solid transparent;cursor:pointer;font-size:13px;font-weight:bold;margin:0}.role input{display:none}.role.active{border-color:#38bdf8;background:#1e3a8a}.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#38bdf8;font-weight:bold;margin-top:20px;cursor:pointer}.back{display:block;text-align:center;margin-top:15px;color:#94a3b8;text-decoration:none;font-size:13px}.error{background:#7f1d1d;padding:10px;border-radius:8px;font-size:13px;text-align:center}</style></head><body><div class="box"><h2>🔐 Login</h2><p class="sub">Choose your role to continue</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST">{% csrf_token %}<label>Select Role</label><div class="roles"><label class="role active" onclick="selectRole(this)"><input type="radio" name="role" value="owner" checked> 👑 Owner</label><label class="role" onclick="selectRole(this)"><input type="radio" name="role" value="viewer"> 👁️ Viewer</label><label class="role" onclick="selectRole(this)"><input type="radio" name="role" value="admin"> 🛡️ Admin</label></div><label>Username</label><input type="text" name="username" placeholder="Enter Username" required><label>Password</label><input type="password" name="password" placeholder="Enter Password" required><button class="btn" type="submit">Login →</button></form><a href="/signup/" class="back">Don't have account? Sign Up</a><a href="/" class="back">← Back to Home</a></div><script>function selectRole(el){document.querySelectorAll('.role').forEach(r=>r.classList.remove('active'));el.classList.add('active');}</script></body></html>
