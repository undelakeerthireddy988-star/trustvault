<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TrustVault | Login</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;background:linear-gradient(135deg,#0A0A0A 0%,#1F2937 100%);display:flex;justify-content:center;padding:8px;color:white}.box{width:100%;max-width:360px}.logo{text-align:center;color:#FFFFFF;font-size:18px;font-weight:bold;margin-bottom:6px}.lock{width:40px;height:40px;background:#111827;border:1px solid #374151;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 8px}h1{text-align:center;font-size:21px}.sub{text-align:center;color:#9CA3AF;margin:5px 0 12px;font-size:12px}.error{background:#4a1e2e;color:#ffc5d5;padding:8px;border-radius:8px;margin-bottom:10px;text-align:center;font-size:13px}label{display:block;margin-bottom:3px;font-size:12px}input{width:100%;padding:9px 11px;background:#0A0A0A;border:1px solid #374151;border-radius:8px;color:white;margin-bottom:8px;outline:none;font-size:13px}button{width:100%;padding:10px;border:none;border-radius:8px;background:#FFFFFF;color:#000000;font-weight:bold;font-size:14px;cursor:pointer}.forgot{display:block;text-align:center;color:#FFFFFF;text-decoration:none;margin-top:10px;font-size:12px;font-weight:bold}.links{text-align:center;color:#9CA3AF;margin-top:10px;font-size:12px}.links a{color:#FFFFFF;text-decoration:none;font-weight:bold}.home{display:block;text-align:center;color:#9CA3AF;text-decoration:none;margin-top:8px;font-size:12px}</style>
</head><body><div class="box"><div class="logo">◇ <span>TrustVault</span></div><div class="lock">🔐</div><h1>Welcome Back</h1><p class="sub">Your private space is waiting for you.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST">{% csrf_token %}<label>Username</label><input type="text" name="username" placeholder="Enter your username" required><label>Password</label><input type="password" name="password" placeholder="Enter your password" required><button type="submit">Login to TrustVault →</button></form><a href="/forgot-password/" class="forgot">Forgot Password?</a><p class="links">Don't have an account? <a href="/signup/">Create Account</a></p><a href="/" class="home">← Back to Home</a></div></body></html>
