<!DOCTYPE html><html><head><title>Viewer - TrustVault</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#0a0f1e;color:white;padding:20px}.box{max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}input{width:100%;padding:12px;border-radius:8px;border:none;background:#1e293b;color:white;margin-top:15px}.card{background:#1e293b;padding:15px;border-radius:10px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}a{color:#94a3b8;text-decoration:none}.logout{color:white;background:#dc2626;padding:8px 15px;border-radius:8px}.note{background:#1e3a8a;padding:12px;border-radius:8px;margin-top:15px;font-size:13px;text-align:center}</style></head><body><div class="box"><div class="top"><h2>👁️ Viewer Dashboard</h2><a href="/logout/" class="logout">Logout</a></div><p style="color:#94a3b8;margin-top:5px">Welcome {{ user.username }} - You can only Search and View
Viewer does not have Upload / Delete permission. Only Search + View allowed.</div><form method="GET"><input type="text" name="q" value="{{ q }}" placeholder="🔍 Search documents..."></form>{% for d in docs %}<div class="card"><span>📄 {{ d.title }} - by {{ d.owner.username }}</span><a href="{{ d.file.url }}" target="_blank">View →</a></div>{% empty %}<p style="text-align:center;color:#94a3b8;margin-top:20px">No documents found.</p>{% endfor %}<a href="/" style="display:block;text-align:center;margin-top:20px">← Back to Home</a></div></body></html>
