
<!DOCTYPE html>
<html>
<head>
<title>Upload - TrustVault</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:#0f172a; color:white; display:flex; justify-content:center; padding:30px 20px; }
.box { background:#1e293b; padding:30px; border-radius:15px; width:100%; max-width:420px; }
h2 { color:#38bdf8; text-align:center; margin-bottom:5px; }
.sub { text-align:center; color:#94a3b8; font-size:13px; margin-bottom:20px; }
label { font-size:13px; color:#cbd5e1; display:block; margin-bottom:6px; margin-top:12px; }
input, select { width:100%; padding:12px; border:none; border-radius:8px; background:#0f172a; color:white; outline:none; }
.btn { width:100%; padding:13px; border:none; border-radius:10px; background:#38bdf8; font-weight:bold; margin-top:20px; cursor:pointer; font-size:15px; }
.back { display:block; text-align:center; margin-top:15px; color:#94a3b8; text-decoration:none; font-size:13px; }
.file-box { border:2px dashed #38bdf8; padding:25px; text-align:center; border-radius:10px; margin-top:5px; color:#94a3b8; }
</style>
</head>
<body>
<div class="box">
  <h2>📤 Upload Document</h2>
  <p class="sub">Only Owner can upload. Viewer can only view.</p>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Document Title</label>
    <input type="text" name="title" placeholder="Ex: My Aadhar Card / Marks Memo" required>

    <label>Select File</label>
    <div class="file-box">
      <input type="file" name="file" required style="background:transparent;">
      <p style="font-size:12px; margin-top:8px;">PDF, Image, Doc - Max 10MB</p>
    </div>

    <label>Share With (Viewer Email)</label>
    <input type="email" name="shared_with" placeholder="viewer@trustvault.com">

    <button class="btn" type="submit">Upload Securely 🔒</button>
  </form>
  <a href="/dashboard/" class="back">← Back to Dashboard</a>
</div>
</body>
</html>
