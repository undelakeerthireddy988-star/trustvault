{% extends "vault/base.html" %}
{% block content %}
<div class="card">
 <h2>{{ heading }}</h2>
 <form method="post" enctype="multipart/form-data">{% csrf_token %}
  {{ form.as_p }}
  <button>Save</button> <a class="btn" href="{{ back }}">Cancel</a>
 </form>
 <p class="muted">Allowed: pdf, png, jpg, docx, xlsx, txt. Up to 10 MB.</p>
</div>
{% endblock %}
