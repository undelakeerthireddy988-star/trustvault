<!DOCTYPE html><html><head><title>Sign Up - TrustVault</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#0a0f1e;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#1e2a3a;width:100%;max-width:420px;padding:30px;border-radius:15px}h2{text-align:center}.sub{text-align:center;color:#cbd5e1;font-size:13px;margin:8px 0 20px}label{font-size:13px;display:block;margin-top:14px;margin-bottom:6px}input{width:100%;padding:13px;border-radius:8px;background:#16202e;color:white;border:1px solid #3b4a63;outline:none}.roles{display:flex;gap:8px;margin-top:6px}.roles label{flex:1;text-align:center;padding:12px 5px;border:1px solid #3b4a63;border-radius:8px;background:#16202e;cursor:pointer;font-size:13px;margin:0}.roles input{width:auto}.btn{width:100%;padding:13px;border:none;border-radius:10px;background:white;color:#1e293b;font-weight:bold;margin-top:22px;cursor:pointer}.error{background:#dc2626;padding:10px;border-radius:8px;font-size:13px;text-align:center}.link{text-align:center;margin-top:18px;font-size:13px}.link a{color:white;font-weight:bold;text-decoration:none}.back{display:block;text-align:center;margin-top:12px;color:#94a3b8;text-decoration:none;font-size:13px}</style></head><body><div class="box"><h2>✨ Create Account</h2><p class="sub">Join TrustVault</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST">{% csrf_token %}<label>Username</label><input type="text" name="username" placeholder="Ex: nivas" required><label>Password</label><input type="password" name="password" placeholder="Min 4 characters" required><label>Select Role</label><div class="roles"><label><input type="radio" name="role" value="owner" checked> 👑 Owner</label><label><input type="radio" name="role" value="viewer"> 👁️ Viewer</label><label><input type="radio" name="role" value="admin"> 🛡️ Admin</label></div><button class="btn" type="submit">Create Account →</button></form><p class="link">Already have an account? <a href="/login/">Login</a></p><a href="/" class="back">← Back to Home</a></div></body></html>
