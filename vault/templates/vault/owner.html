<!DOCTYPE html><html><head><title>Owner - TrustVault</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}body{background:#0a0f1e;color:white;padding:20px}.box{max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}input{width:100%;padding:12px;border-radius:8px;border:none;background:#1e293b;color:white;margin-top:15px}form.upload{background:#1e293b;padding:20px;border-radius:12px;margin-top:15px}button{padding:12px 20px;border:none;border-radius:8px;background:#38bdf8;font-weight:bold;cursor:pointer;margin-top:10px}.card{background:#1e293b;padding:15px;border-radius:10px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}a{color:#94a3b8;text-decoration:none}.del{color:#f87171;font-weight:bold}.logout{color:white;background:#dc2626;padding:8px 15px;border-radius:8px}</style></head><body><div class="box"><div class="top"><h2>👑 Owner Dashboard</h2><a href="/logout/" class="logout">Logout</a></div><p style="color:#94a3b8;margin-top:5px">Welcome {{ user.username }} - Upload, Search, Delete cheyachu</p><form method="GET"><input type="text" name="q" value="{{ q }}" placeholder="🔍 Search documents..."></form><form method="POST" enctype="multipart/form-data" class="upload">{% csrf_token %}<input type="text" name="title" placeholder="Document Title Ex: Aadhaar" required><input type="file" name="file" required><button type="submit">📤 Upload</button></form>{% for d in docs %}<div class="card"><span>📄 {{ d.title }}</span><span><a href="{{ d.file.url }}" target="_blank">View</a> &nbsp; <a href="/owner/delete/{{ d.id }}/" class="del">Delete</a></span></div>{% empty %}<p style="text-align:center;color:#94a3b8;margin-top:20px">No documents yet.</p>{% endfor %}<a href="/" style="display:block;text-align:center;margin-top:20px">← Back to Home</a></div></body></html>
